<svg xmlns="http://www.w3.org/2000/svg" viewBox="13.5 9.5 37 45" role="img" aria-label="Lampsill">
  <title>Lampsill</title>
  <!--
    THE SAME MARK AS THE MASTHEAD. Geometry, viewBox, stroke weights and the
    half opacity mullions are copied from `Mark` in components/Chrome.tsx.
    Change one, change both, or the tab stops matching the page.

    The opacity belongs on the GROUP, not on each stroke: a group is composited
    once, so the two mullions don't double up into a darker knot where they
    cross. That knot is visible at 16px; this way there isn't one.

    The one unavoidable difference is colour. These are hard coded instead of
    the CSS custom properties the masthead uses, because a favicon has no page
    to inherit from and a currentColor mark rendered standalone resolves to
    black. The values are the light theme ones from app/globals.css.

    ⚠️ NO DOUBLE HYPHEN ANYWHERE IN THIS COMMENT. XML forbids it, and an
    unparseable icon.svg is not a broken line or a wrong colour, it is a blank
    square in every tab. Naming a CSS variable in the usual way is enough to do
    it, which is how this file was briefly broken.

    An earlier version dropped both mullions on the grounds that they close the
    interior up at tab size. They don't: the cross still reads as a window at
    16px, and the arch without it reads as a padlock.
  -->
  <g fill="none" stroke="#8FBCE0" stroke-width="4.8" stroke-linejoin="round">
    <path d="M16 52 L16 28 A16 16 0 0 1 48 28 L48 52 Z"/>
  </g>
  <g fill="none" stroke="#8FBCE0" stroke-width="3.2" stroke-linecap="round" opacity="0.5">
    <path d="M32 13 L32 52"/>
    <path d="M17 34 L47 34"/>
  </g>
  <rect x="20" y="37.5" width="9" height="10.5" rx="1" fill="#F5C97B"/>
</svg>
